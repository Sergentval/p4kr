[package]
name = "p4kr-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reader for .p4k archives: central directory, entries, decryption, parallel extraction."

[dependencies]
memmap2 = "0.9"
zstd = { version = "0.13", default-features = false }
aes = "0.8"
cbc = "0.1"
crc32c = "0.6"
sha2 = "0.10"
thiserror = "2"
rayon = "1"
p4kr-cryxml = { path = "../p4kr-cryxml" }
p4kr-dataforge = { path = "../p4kr-dataforge" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
